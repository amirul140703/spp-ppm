    // --- 2. ROLE SWITCHING SIMULATION (RBAC) ---
    function switchRole(newRole) {
      DB.currentUser.role = newRole;
      const roleNames = {
        'superadmin': 'Superadmin (ICT/Penuh)',
        'urus_setia': 'Pegawai Urus Setia PPM',
        'bendahari': 'Bendahari & Pelulus Kewangan',
        'pegawai_cpd': 'Pegawai Semakan CPD',
        'suruhanjaya_undi': 'Jawatankuasa Pemilihan',
        'ahli': 'Ahli Biasa (Layan Diri)'
      };
      
      document.getElementById('user-display-role').innerText = roleNames[newRole] || newRole;
      showToast(`Peranan ditukar kepada: ${roleNames[newRole]}`, 'info');
      logAuditAction(`TUKAR_PERANAN_SIMULASI`, `Pengguna bertukar ke peranan ${newRole}`);
      
      // Refresh current view
      navigateTo(currentActiveView);
    }

    // --- 3. AUDIT TRAIL LOGGING (Immutable principle FR-053) ---
    function logAuditAction(action, details, target = "Sistem") {
      const now = new Date();
      const dateStr = now.toISOString().slice(0, 19).replace('T', ' ');
      const newLog = {
        id: `aud-${Math.floor(100 + Math.random() * 900)}`,
        timestamp: dateStr,
        actor: `${DB.currentUser.role.toUpperCase()} (${DB.currentUser.name})`,
        action: action,
        target: target,
        details: details
      };
      DB.auditLogs.unshift(newLog);
    }

    // --- 4. TOAST NOTIFICATION SYSTEM ---
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      const toastIcon = document.getElementById('toast-icon');

      toastMsg.innerText = message;
      if (type === 'success') {
        toastIcon.innerHTML = `<i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>`;
      } else if (type === 'error') {
        toastIcon.innerHTML = `<i data-lucide="alert-triangle" class="w-5 h-5 text-rose-400"></i>`;
      } else {
        toastIcon.innerHTML = `<i data-lucide="info" class="w-5 h-5 text-blue-400"></i>`;
      }
      lucide.createIcons();

      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 3500);
    }

    // --- 5. MODAL SYSTEM ---
    function openModal(title, contentHtml, footerHtml = null) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body').innerHTML = contentHtml;
      if (footerHtml) {
        document.getElementById('modal-footer').innerHTML = footerHtml;
      } else {
        document.getElementById('modal-footer').innerHTML = `<button onclick="closeModal()" class="px-4 py-2 text-xs font-semibold rounded-lg border border-slate-300 hover:bg-slate-100 text-slate-700">Tutup</button>`;
      }
      document.getElementById('modal-container').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('modal-container').classList.add('hidden');

    function navigateTo(viewId) {
      currentActiveView = viewId;

      // Update sidebar state
      document.querySelectorAll('.nav-item').forEach(btn => {
        if (btn.getAttribute('data-view') === viewId) {
          btn.classList.add('bg-blue-600', 'text-white');
          btn.classList.remove('hover:bg-slate-800', 'text-slate-300');
        } else {
          btn.classList.remove('bg-blue-600', 'text-white');
          btn.classList.add('hover:bg-slate-800', 'text-slate-300');
        }
      });

      const titles = {
        'm11_dashboard': { breadcrumb: 'Sistem Pengurusan Persatuan', title: 'M11 Papan Pemuka Eksekutif & Statistik' },
        'm02_portal': { breadcrumb: 'Portal Ahli Layan Diri', title: 'M02 Profil Keahlian & Kad Digital Pintar' },

        'm08_pilihanraya': { breadcrumb: 'E-Pilihan Raya Rahsia', title: 'M08 Undian Majlis & Token Pengundi Bebas' },
        'm09_komunikasi': { breadcrumb: 'Pusat Sebaran Maklumat', title: 'M09 Pengumuman, Notifikasi & E-mel Pukal' },
        'm10_dokumen': { breadcrumb: 'Pengurusan Rekod & Fail', title: 'M10 Repositori Dokumen, Versi & Arkib' },
        'm12_tetapan': { breadcrumb: 'Pentadbiran Sistem & Sekuriti', title: 'M12 Log Audit Statutori & Kawalan Akses' }
      };

      const info = titles[viewId] || { breadcrumb: 'SPP-PPM', title: 'Modul Sistem' };
      document.getElementById('page-breadcrumb').innerText = info.breadcrumb;
      document.getElementById('page-title').innerText = info.title;

      const main = document.getElementById('main-content');

      // Dispatch module renderer
      switch(viewId) {
        case 'm11_dashboard': renderM11Dashboard(main); break;
        case 'm02_portal': renderM02Portal(main); break;
        case 'm01_keahlian': renderM01Keahlian(main); break;
        case 'm03_yuran': renderM03Yuran(main); break;
        case 'm04_kewangan': renderM04Kewangan(main); break;
        case 'm05_program': renderM05Program(main); break;
        case 'm06_cpd': renderM06CPD(main); break;
        case 'm07_mesyuarat': renderM07Mesyuarat(main); break;
        case 'm08_pilihanraya': renderM08Pilihanraya(main); break;
        case 'm09_komunikasi': renderM09Komunikasi(main); break;
        case 'm10_dokumen': renderM10Dokumen(main); break;
        case 'm12_tetapan': renderM12Tetapan(main); break;
        default: renderM02Portal(main);
      }

      lucide.createIcons();
    }

    function getStatusBadge(status) {
      switch(status) {
        case 'submitted': return `<span class="bg-slate-100 text-slate-700 border border-slate-300 px-2 py-0.5 rounded text-[10px] font-bold">Dihantar</span>`;
        case 'under_review': return `<span class="bg-blue-100 text-blue-800 border border-blue-200 px-2 py-0.5 rounded text-[10px] font-bold">Dalam Semakan</span>`;
        case 'query': return `<span class="bg-amber-100 text-amber-800 border border-amber-200 px-2 py-0.5 rounded text-[10px] font-bold">Memerlukan Kuiri</span>`;
        case 'approved': return `<span class="bg-emerald-100 text-emerald-800 border border-emerald-200 px-2 py-0.5 rounded text-[10px] font-bold">Diluluskan</span>`;
        case 'rejected': return `<span class="bg-rose-100 text-rose-800 border border-rose-200 px-2 py-0.5 rounded text-[10px] font-bold">Ditolak</span>`;
        default: return `<span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[10px]">${status}</span>`;
      }
    }

    function reviewApplication(appId, decision) {
      const app = DB.applications.find(a => a.id === appId);
      if (!app) return;

      if (decision === 'approved') {
        app.status = 'approved';
        logAuditAction('LULUS_PERMOHONAN_KEAHLIAN', `Permohonan ${app.id} (${app.name}) diluluskan. Invois pendaftaran dijana.`, app.id);
        // Automatik cipta invois mengikut FR-003 & Lampiran A
        DB.invoices.push({
          no: `INV-2026-REG${Math.floor(100 + Math.random()*900)}`,

        const queryReason = prompt("Sila nyatakan catatan kuiri / dokumen tambahan yang diperlukan:", "Sila muat naik transkrip rasmi atau pengesahan ijazah sains perpustakaan.");

    function submitNewApplication(e) {
      e.preventDefault();
      const name = document.getElementById('app-name').value;
      const ic = document.getElementById('app-ic').value;
      const cat = document.getElementById('app-category').value;
      const org = document.getElementById('app-org').value;

      // Duplicate check (FR-002)
      const duplicate = DB.applications.find(a => a.ic === ic);
      if (duplicate) {
        alert("RALAT FR-002: Rekod permohonan dengan No. KP ini telah wujud dalam sistem!");
        return;
      }

      const newId = `APP-09${Math.floor(50 + Math.random()*49)}`;
      DB.applications.unshift({
        id: newId,
        name: name,
        ic: ic,
        category: cat,
        org: org,
        date: new Date().toISOString().slice(0, 10),
        status: "submitted",
        docs: "dokumen_kelayakan_upload.pdf"
      });

      logAuditAction('PERMOHONAN_KEAHLIAN_BARU', `Pemohon ${name} (${ic}) mendaftar kategori ${cat}`, newId);
      closeModal();
      showToast(`Permohonan ${newId} berjaya dihantar untuk semakan urus setia.`);
      navigateTo('m01_keahlian');
    }

    function simulateSuccessfulPayment(invNo) {
      const inv = DB.invoices.find(i => i.no === invNo);

      // Idempotency check simulation (UAT-02)
      if (inv.status === 'paid') {
        showToast('RALAT IDEMPOTENSI: Invois ini telahpun disahkan bayarannya.', 'error');
        closeModal();
        return;
      }

      const receiptNumber = `RES-PPM-${Math.floor(5000 + Math.random()*4999)}`;
      inv.status = 'paid';
      inv.receiptNo = receiptNumber;

      // Catat dalam lejar akaun automatik (FR-018)
      DB.journalEntries.push({
        id: `JRN-${Math.floor(9000 + Math.random()*900)}`,
        date: new Date().toISOString().slice(0, 10),
        desc: `Penerimaan bayaran ${inv.desc} (${invNo})`,
        debitAcc: "1001-Akaun Bank Utama (Maybank)",
        debit: inv.amount,
        creditAcc: "4001-Hasil Kutipan Yuran",
        credit: inv.amount
      });

      logAuditAction('TERIMA_BAYARAN_WEBHOOK', `Bayaran ${invNo} berjaya disahkan. Resit dijana: ${receiptNumber}`, invNo);
      closeModal();
      showToast(`Pembayaran RM ${inv.amount.toFixed(2)} berjaya! Resit rasmi ${receiptNumber} dikeluarkan.`);
      navigateTo('m03_yuran');
    }

    function submitNewVoucher(e) {
      e.preventDefault();
      const claimant = document.getElementById('vch-claimant').value;
      const purpose = document.getElementById('vch-purpose').value;
      const amount = parseFloat(document.getElementById('vch-amount').value);

      const newId = `VCH-2026-0${Math.floor(20 + Math.random()*79)}`;
      DB.vouchers.push({
        id: newId,
        claimant: claimant,
        purpose: purpose,
        amount: amount,
        status: "submitted",
        approver: "Menunggu Kelulusan",
        date: new Date().toISOString().slice(0, 10)
      });

      logAuditAction('CIPTA_BAUCAR_BAYARAN', `Baucar ${newId} (RM ${amount}) dihantar oleh ${claimant}`, newId);
      closeModal();
      showToast(`Baucar ${newId} berjaya dihantar untuk kelulusan bendahari.`);
      navigateTo('m04_kewangan');

    function approveVoucher(voucherId) {
      const v = DB.vouchers.find(item => item.id === voucherId);
      if (!v) return;

      // Pemisahan tugas pemohon & pelulus (UAT-08)
      if (v.claimant.includes(DB.currentUser.name)) {
        showToast("RALAT UAT-08: Anda tidak boleh meluluskan baucar tuntutan anda sendiri!", "error");
        return;
      }

      v.status = "approved";
      v.approver = `${DB.currentUser.name} (Bendahari)`;

      // Pos terus ke lejar bergu (FR-018)
      DB.journalEntries.push({
        id: `JRN-${Math.floor(9200 + Math.random()*700)}`,
        date: new Date().toISOString().slice(0, 10),
        desc: `Bayaran baucar ${v.id}: ${v.purpose}`,
        debitAcc: "5010-Perbelanjaan Operasi & Acara",
        debit: v.amount,
        creditAcc: "1001-Akaun Bank Utama",
        credit: v.amount
      });

      logAuditAction('LULUS_BAUCAR_KEWANGAN', `Baucar ${v.id} berjaya diluluskan sebanyak RM ${v.amount.toFixed(2)}`, v.id);
      showToast(`Baucar ${v.id} diluluskan dan dipos ke Lejar Am.`);
      navigateTo('m04_kewangan');
    }

    function reviewCpdClaim(claimId, decision) {
      const claim = DB.cpdClaims.find(c => c.id === claimId);
      if (!claim) return;

      if (decision === 'approved') {
        claim.status = 'approved';
        claim.approvedBy = `${DB.currentUser.name} (Pegawai CPD)`;
        DB.currentUser.cpdPoints += claim.points;
        logAuditAction('LULUS_TUNTUTAN_CPD', `Tuntutan ${claim.id} diluluskan (+${claim.points} mata)`, claim.id);
        showToast(`Tuntutan ${claim.id} diluluskan. Mata dikreditkan ke transkrip.`);
      } else if (decision === 'query') {
        const note = prompt("Catatan kuiri bukti sijil:", "Sila lampirkan surat pengesyoran penganjur yang bertandatangan.");
        if (!note) return;
        claim.status = 'query';
        claim.note = note;

    function castBallot() {
      const presChecked = document.querySelector('input[name="vote-presiden"]:checked');
      const naibChecked = document.querySelector('input[name="vote-naib"]:checked');

      if (!presChecked || !naibChecked) {
        showToast("Sila lengkapkan pilihan undian bagi kedua-dua jawatan yang dipertandingkan.", "error");
        return;
      }

      openModal(
        "Pengesahan Undi Sulit (FR-037)",
        `
        <div class="space-y-3 text-xs">
          <p class="text-slate-700">Adakah anda pasti dengan pilihan undian anda? Tindakan ini adalah muktamad.</p>

          </div>
        </div>
        `,
        `
        <button onclick="closeModal()" class="px-3 py-1.5 border rounded text-xs">Batal</button>
        <button onclick="confirmCastBallot('${presChecked.value}', '${naibChecked.value}')" class="px-4 py-1.5 bg-blue-600 text-white font-bold rounded text-xs shadow">Sahkan & Masukkan Undi</button>
        `
      );
    }

    function confirmCastBallot(presId, naibId) {
      const cPres = DB.election.candidates.find(c => c.id === presId);
      const cNaib = DB.election.candidates.find(c => c.id === naibId);
      if (cPres) cPres.votesCount += 1;
      if (cNaib) cNaib.votesCount += 1;

      DB.election.alreadyVoted = true;
      logAuditAction('UNDI_SULIT_DIMASUKKAN', 'Undi tanpa nama dimasukkan ke peti undi digital. Token pengundi dilupuskan serta-merta.');
      closeModal();
      showToast('Undi anda telah berjaya direkodkan secara rahsia. Terima kasih kerana menunaikan tanggungjawab!');
      navigateTo('m08_pilihanraya');
    }

    function submitNewDocument(e) {
      e.preventDefault();
      const title = document.getElementById('doc-title').value;
      const cat = document.getElementById('doc-cat').value;
      const ver = document.getElementById('doc-ver').value;
      const cls = document.getElementById('doc-class').value;

      DB.documents.push({
        id: `DOC-0${DB.documents.length + 1}`,
        title: title,
        cat: cat,
        version: ver,
        classification: cls,
        access: cls === 'Awam' ? 'Semua Ahli' : 'AJK Majlis PPM'
      });

      logAuditAction('MUAT_NAIK_DOKUMEN', `Dokumen '${title}' (${ver}) diklasifikasi sebagai ${cls}`);
      closeModal();
      showToast(`Dokumen '${title}' berjaya dimuat naik ke repositori.`);
      navigateTo('m10_dokumen');
    }

    function downloadDocument(docId, classification) {
      // Kawalan Akses Dokumen Terhad (UAT-10)
      if (classification === 'Rahsia Rasmi' && !['superadmin', 'bendahari'].includes(DB.currentUser.role)) {
        showToast("RALAT UAT-10: Anda tidak mempunyai kebenaran keselamatan untuk memuat turun dokumen Rahsia Rasmi ini!", "error");
        logAuditAction('CUBAAN_AKSES_DOKUMEN_GAGAL', `Pengguna ${DB.currentUser.name} cuba mengakses dokumen terkawal ${docId}`);
        return;
      }
      showToast(`Memuat turun fail ${docId}...`);
      logAuditAction('MUAT_TURUN_DOKUMEN', `Muat turun fail dokumen rasmi ${docId}`);
    }
